# Workaround for AGP non-ASCII path check (project lives under a Chinese-named dir).
# http://b.android.com/95744
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 8.7 predates SDK 36; the platform is installed and compiles fine.
# AGP 9 built-in Kotlin rejects plugins that touch the kotlin.sourceSets DSL
# (KSP / the Compose compiler plugin still do). AGP itself names this flag as the
# supported escape hatch in its own error message.
android.disallowKotlinSourceSets=false
