plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.thirdparty.xhs'
    compileSdk 34

    defaultConfig {
        applicationId "com.thirdparty.xhs"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "2.6.0"
        // mirror the examined app's client identity so the backend accepts us
        buildConfigField "String", "CLIENT_CHANNEL", "\"1333\""
        buildConfigField "String", "CLIENT_VERSION", "\"2.6.0\""
        vectorDrawables { useSupportLibrary true }
    }

    /**
     * A release APK the system will actually install needs a signature.
     *
     * Self-signed and checked in on purpose: this is a personal client, so a
     * reproducible release build matters more than keeping the key secret, and
     * every future release must be signed by the SAME key or Android will refuse
     * to upgrade an installed copy.
     */
    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'xhs-thirdparty'
            keyAlias 'xhs'
            keyPassword 'xhs-thirdparty'
        }
    }

    buildTypes {
        debug {
            // Distinct package so a debug build and a release build can be
            // installed side by side, and so testing never touches the release
            // install's data (prefs, Room DB, account identity are per-package).
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            // R8 shrinking + resource shrinking are on for the release package.
            // This is verified by RUNNING the built APK (install → navigate the
            // real screens), not by "it compiled" — a stripped reflection path only
            // shows up at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // matches Kotlin 1.9.22
        kotlinCompilerExtensionVersion = '1.5.8'
    }
    packagingOptions {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    // ---- core ----
    // NOTE: no appcompat / com.google.android.material — the UI is pure Compose
    // and the launch theme's parent is the framework `android:Theme.Material.*`,
    // so both libraries were dead weight (~2MB of APK, plus a chunk of dex).
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // ---- Jetpack Compose (BOM) ----
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ---- navigation + lifecycle for Compose ----
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'

    // ---- networking / crypto / json ----
    // org.json (bundled in the framework) is what every model already parses
    // with; gson was unused.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // ---- local persistence (Room) ----
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // ---- HLS video (media3) + compose player ----
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'

    // ---- coroutines ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    testImplementation 'junit:junit:4.13.2'
}