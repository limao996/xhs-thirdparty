# Workaround for AGP non-ASCII path check (project lives under a Chinese-named dir).
# http://b.android.com/95744
android.overridePathCheck=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 内置的 Kotlin 支持会拒绝改动 kotlin.sourceSets DSL 的插件（KSP / Compose 编译器插件仍在改）。
# AGP 自己在报错信息里把这个 flag 列为支持的逃生口。
android.disallowKotlinSourceSets=false
