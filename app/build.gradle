plugins {
    id 'com.android.application'
    // AGP 9 compiles Kotlin itself and already registers a 'kotlin' extension;
    // applying org.jetbrains.kotlin.android on top fails with
    // "Cannot add extension with name 'kotlin'".
    // Kotlin 2.x moved the Compose compiler out of AGP into this plugin
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// ---- 版本 ----------------------------------------------------------------
//
// 三件事分开看（以前都写 2.6.0 只是顺手对齐，并不是"必须"）：
//
//   versionName    —— 给人看的（安装界面 / 应用信息）。就是 `1.1.0` 这种形式，
//                     **手工按需推进**（功能批次变了再改），不再跟后端版本缠在一起。
//   versionCode    —— Android 用来判断"能不能覆盖安装"的整数，**必须是 32 位有符号整数**
//                     （上限 2147483647）。所以「年(2位)月日时分秒」这种 12 位时间戳
//                     放不下（261004124530 ≈ 2.6e11），连 10 位的 2610041245 也超了
//                     （2.6e9 > 2.1e9）—— 时间戳没法直接当版本号。
//                     这里用「**2026-10-01 00:00:00 起的秒数**」：时间驱动、单调递增、
//                     每次构建都不同，而且装得下（现在约 2.6e5；32 位能用约 68 年）。
//   CLIENT_VERSION —— 发请求时带的 `Client-Version` 头（见 net/XhsApi），后端按它决定
//                     行为，**必须保持 2.6.0**，与服务端对齐的是它、不是 App 版本。
def appVersionName = '1.3.0'
def versionEpochSeconds = java.time.LocalDateTime.of(2026, 10, 1, 0, 0, 0)
    .atZone(java.time.ZoneId.systemDefault())
    .toEpochSecond()
def appVersionCode = (int) (System.currentTimeMillis() / 1000L - versionEpochSeconds)

android {
    namespace 'com.thirdparty.xhs'
    compileSdk 37

    defaultConfig {
        applicationId "com.thirdparty.xhs"
        // 26，不是 24：画中画（PictureInPictureParams / RemoteAction）本身就是 API 26 起，
        // 而这个 App 的播放器主路径已经和小窗绑在一起；再加上 Compose M3 Expressive 与 media3
        // 在 24/25 上的兼容成本，继续挂着 24 只会留一堆"某条分支在 7.x 上必崩"的隐患。
        // 详见 docs/REVIEW.md（P0-2）。
        minSdk 26
        targetSdk 37
        versionCode appVersionCode
        versionName appVersionName
        // mirror the examined app's client identity so the backend accepts us
        buildConfigField "String", "CLIENT_CHANNEL", "\"1333\""
        buildConfigField "String", "CLIENT_VERSION", "\"2.6.0\""
        vectorDrawables { useSupportLibrary true }
    }

    /**
     * A release APK the system will actually install needs a signature.
     *
     * Self-signed and checked in on purpose: this is a personal client, so a
     * reproducible release build matters more than keeping the key secret, and
     * every future release must be signed by the SAME key or Android will refuse
     * to upgrade an installed copy.
     */
    signingConfigs {
        release {
            storeFile file('../keystore/release.jks')
            storePassword 'xhs-thirdparty'
            keyAlias 'xhs'
            keyPassword 'xhs-thirdparty'
        }
    }

    buildTypes {
        debug {
            // Distinct package so a debug build and a release build can be
            // installed side by side, and so testing never touches the release
            // install's data (prefs, Room DB, account identity are per-package).
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            // R8 shrinking + resource shrinking are on for the release package.
            // This is verified by RUNNING the built APK (install → navigate the
            // real screens), not by "it compiled" — a stripped reflection path only
            // shows up at runtime.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // NOTE: `kotlinOptions { jvmTarget = ... }` was removed in AGP 9 along with
    // the rest of the old Kotlin DSL; the compiler target is configured by the
    // top-level `kotlin { compilerOptions { } }` block below.
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    // ---- core ----
    // NOTE: no appcompat / com.google.android.material — the UI is pure Compose
    // and the launch theme's parent is the framework `android:Theme.Material.*`,
    // so both libraries were dead weight (~2MB of APK, plus a chunk of dex).
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'

    // ---- Jetpack Compose (BOM) ----
    // 2026.02.01 ships material3 1.4.0 — the M3 Expressive release.
    implementation platform('androidx.compose:compose-bom:2026.02.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    // material3 is deliberately pinned ABOVE the BOM: M3 Expressive
    // (MaterialExpressiveTheme + MotionScheme) is still @Experimental and is only
    // exposed publicly from the 1.5.0-alpha line. 1.4.0 ships the components but
    // keeps the theming API internal, so it cannot be adopted from there.
    implementation 'androidx.compose.material3:material3:1.5.0-alpha29'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // ---- navigation + lifecycle for Compose ----
    implementation 'androidx.navigation:navigation-compose:2.9.5'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'
    // fingerprint / face unlock for the app lock (works back to API 23)
    implementation 'androidx.biometric:biometric:1.1.0'
    // biometric 1.1.0 pulls in fragment 1.2.5, whose FragmentActivity rejects the
    // request codes Compose's ActivityResultRegistry generates (they exceed 16
    // bits), so every registerForActivityResult launcher died with
    // 'Can only use lower 16 bits for requestCode'.
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    // ---- networking / crypto / json ----
    // org.json (bundled in the framework) is what every model already parses
    // with; gson was unused.
    implementation 'com.squareup.okhttp3:okhttp:5.1.0'

    // ---- local persistence (Room) ----
    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    // ---- HLS video (media3) + compose player ----
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'

    // ---- coroutines ----
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'

    testImplementation 'junit:junit:4.13.2'
    // 本地单元测试里 android 自带的 org.json 是空壳（调用即 "not mocked"），
    // 检查更新的应答解析要真实现才能在 JVM 上测（只影响测试 classpath）。
    testImplementation 'org.json:json:20240303'
}