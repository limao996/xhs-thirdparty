name: 功能建议
description: 提出一个改进或新功能（不含内容规避类需求）
title: "[Feature] "
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        请说明**要解决的问题**，而不只是"想要某个界面"。
        注意：本项目不做付费内容规避、不做写操作（发评论/点赞）、不内置任何内容数据，
        这类需求会被直接关闭。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: "在 XX 场景下，我必须 …，否则 …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 若有明确方案请写出；涉及 UI 请描述交互路径与状态（加载/空/错误）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑过的替代方案
      validations:
        required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 界面 / 交互
        - 播放器
        - 本地存储与备份
        - 网络与协议
        - 构建与工程结构
        - 文档与 AI 档案
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 该需求不涉及绕过付费或访问控制
          required: true
        - label: 该需求不涉及发评论/点赞等写操作
          required: true
        - label: 我已搜索过现有 Issue
          required: true
